<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070a06">
  <title>LIME — Secure Automation</title>
  <style>html,body{margin:0;min-height:100%;background:#050705;color:#edf5e6;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{display:grid;place-items:center;overflow:hidden}main{padding:28px;text-align:center}span{color:#b7f34d;font-weight:800}p{color:#7e8878;font-size:12px}</style>
</head>
<body>
<main><span>LIME</span><p>Loading interface…</p></main>
<script>
const SOURCE='https://raw.githubusercontent.com/lexioipro-sudo/lime-secure-automation-v2/287785f77f16c39026e1bba582ad80f7ba7ce41a/index.html';
(async()=>{
  try{
    const response=await fetch(SOURCE,{cache:'no-store'});
    if(!response.ok) throw new Error('Source returned '+response.status);
    let html=await response.text();
    const replacements=[
      ['◉ Auto Mode','🍪 Cookie Mode'],
      ['◉ Manual Mode','🔒 Password Mode'],
      ['Auto Mode','Cookie Mode'],
      ['Manual Mode','Password Mode'],
      ['Input data','Cookied'],
      ['Paste your data here…','Paste your cookied here…'],
      ['Access key','Password'],
      ['Enter access key','Enter password'],
      ['access-key','password'],
      ['type="text" autocomplete="off" placeholder="Enter password"','type="password" autocomplete="off" placeholder="Enter password"'],
      ["mode='auto'","mode='cookie'"],
      ["mode='manual'","mode='password'"],
      ["mode==='manual'&&!k","mode==='password'&&!k"],
      ["last?.key","last?.password"],
      ["last={data:d,key:!!k}","last={data:d,password:!!k}"]
    ];
    for(const [from,to] of replacements) html=html.split(from).join(to);
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<main style="padding:32px;text-align:center;font-family:monospace;color:#edf5e6;background:#050705"><div style="color:#b7f34d;font-weight:800">LIME</div><p style="color:#e9a86b">Interface failed to load.</p><small style="color:#7e8878">'+String(error).replace(/[&<>]/g,'')+'</small></main>';
  }
})();
</script>
</body>
</html>
